<section class="hero"><div><div class="eyebrow">LEAGUE OF LEGENDS · YOUR TEAM, IN DETAIL</div><h1>每一场并肩，都有迹可循<span>。</span></h1><p id="owner-line"></p></div><div class="hero-note"><span>本工具表现分</span><strong>看数据，也看职责。</strong><small>同模式 · 同英雄定位参照<br>评分与建议均可追溯到对局</small></div></section>
<section class="coverage" aria-label="采集范围"><div id="coverage"></div><details><summary>数据覆盖与验证状态</summary><div id="coverage-details"></div></details></section>
<div class="workspace"><aside class="sidebar"><div class="sidebar-title"><h2>选择一起玩的朋友</h2><span id="selected-count" class="pill">0 位</span></div><p class="muted small">从共同队友中手选，统计只包含与你同队的场次。</p><label class="search-label" for="friend-search">搜索昵称或标签</label><input id="friend-search" type="search" placeholder="找到你的开黑搭子…" autocomplete="off"><div class="friend-tools"><button id="clear-friends" class="text-button">清空选择</button><span id="candidate-count" class="muted small"></span></div><div id="friend-list" class="friend-list"></div><p id="storage-note" class="muted small"></p></aside>
<div class="content"><section class="filters"><label>开始日期<input id="from" type="date"></label><label>结束日期<input id="to" type="date"></label><label>游戏模式<select id="mode"><option value="KIWI">海克斯大乱斗</option><option value="ARAM">普通大乱斗</option><option value="SR">召唤师峡谷</option></select></label><label>对局结果<select id="outcome"><option value="all">全部胜负</option><option value="win">胜局</option><option value="loss">败局</option></select></label><label class="checkbox-label"><input id="exclude-short" type="checkbox">仅正常时长、非提前结束</label><button id="reset-date" class="text-button">全部日期</button></section>
