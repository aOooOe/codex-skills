    if(!rows.length)return out+empty('当前筛选下没有共同对局','可以调整日期、胜负或游戏模式。');
    out+=`<div class="split"><section class="card"><h3>评分拆解</h3>${A.axes.map(a=>`<div class="axis"><span>${A.axisNames[a]}</span><div class="bar"><i style="width:${s.percentiles[a]||0}%"></i></div><span>${num(s.percentiles[a],0)}</span></div>`).join('')}<p class="muted small">各维度为同模式、同英雄定位的平均百分位。每场权重随英雄定位变化；分数为逐场加权后再平均。</p></section><section class="card"><h3>${self?'胜负局表现':'你在完全相同对局中的表现'}</h3>${self?table(['分组','场数','表现分'],[true,false].map(win=>{const m=A.summarize(rows.filter(r=>r.player.win===win));return `<tr><td>${win?'胜局':'败局'}</td><td>${m.n}</td><td>${num(m.score)}</td></tr>`;}).join('')):`<p class="muted small">共同 ${other.n} 场，用同样的对局比较。</p>${table(['指标','对方','你'],[['表现分',num(s.score),num(other.score)],['分均伤害',num(s.metrics.dpm,0),num(other.metrics.dpm,0)],['相对伤转',pct(s.metrics.conversion),pct(other.metrics.conversion)],['参团率',pct(s.metrics.kp),pct(other.metrics.kp)]].map(x=>'<tr>'+x.map(y=>'<td>'+y+'</td>').join('')+'</tr>').join(''))}`}</section></div>`;
    out+=heading('下一步怎么练','EVIDENCE → REVIEW → ACTION')+A.advice(rows).map(ad=>`<article class="advice-card"><h3>${esc(ad.title)}</h3><p>${esc(ad.observation)}</p><p><b>复查问题</b>　${esc(ad.question)}</p><p><b>下一步</b>　${esc(ad.action)}</p><div>${ad.evidence.map(id=>`<button class="evidence-button" data-match="${esc(id)}">${esc(matchById.get(id)?.day)} · ${esc(matchById.get(id)?.gameId)} ↗</button>`).join('')}</div></article>`).join('');
    out+=heading('英雄表现','CHAMPION BREAKDOWN')+groupsTable(rows,p=>p.champion)+heading('英雄定位','CLASS BREAKDOWN')+groupsTable(rows,p=>A.classes[p.classKey]);
    const ps=rows.map(r=>r.player);out+=heading('补充指标','OBSERVED STATS')+table(['场均承伤','场均缓和伤害','场均 totalHeal','分均视野','分均补刀','分均推塔伤害'],`<tr><td>${num(A.mean(ps.map(p=>p.stats.totalDamageTaken)),0)}</td><td>${num(A.mean(ps.map(p=>p.stats.damageSelfMitigated)),0)}</td><td>${num(A.mean(ps.map(p=>p.stats.totalHeal)),0)}</td><td>${num(s.metrics.vision,2)}</td><td>${num(s.metrics.cs,2)}</td><td>${num(s.metrics.turrets,0)}</td></tr>`)+`<p class="notice">承伤和缓和伤害不等于有效开团；totalHeal 可能包含自疗。大乱斗不以补刀、视野作为峡谷式考核标准。</p>`;
    return out;
  }
  function matchesView(){
    const matches=filtered.toReversed(),size=25;state.page=Math.min(Math.max(0,state.page||0),Math.max(0,Math.ceil(matches.length/size)-1));const page=matches.slice(state.page*size,(state.page+1)*size);
    return heading('每场都能展开','MATCH DETAILS · '+matches.length)+table(['时间 / 对局','结果','你的英雄','K / D / A','表现分','共同朋友','查看'],page.map(m=>{const p=m.players.find(p=>p.key===m.ownerKey),friends=m.players.filter(p=>p.ally&&state.friends.includes(p.key));return `<tr><td>${esc(m.day)}<small class="score-label">${esc(m.gameId)} · ${num(m.duration/60,0)} 分钟</small></td><td class="${p.win===true?'win':p.win===false?'loss':''}">${p.win===true?'胜利':p.win===false?'失败':'未知'}</td><td>${esc(p.champion)}</td><td>${num(p.stats.kills,0)} / ${num(p.stats.deaths,0)} / ${num(p.stats.assists,0)}</td><td>${num(p.score)}<small class="score-label">${esc(p.scoreReason||'可评分')}</small></td><td class="cell-name" title="${esc(friends.map(p=>p.name).join('、'))}">${friends.length} 位 · ${esc(friends.map(p=>p.name.split('#')[0]).join('、'))}</td><td><button class="link-button" data-match="${esc(m.id)}">展开 ↗</button></td></tr>`;}).join(''))+`<div class="pagination"><button data-page="-1" ${state.page===0?'disabled':''}>上一页</button><span>${state.page+1} / ${Math.max(1,Math.ceil(matches.length/size))}</span><button data-page="1" ${(state.page+1)*size>=matches.length?'disabled':''}>下一页</button></div>`;
  }
  function method(){return `<article class="method card"><h2>分数怎样计算，建议怎样产生</h2><p>这是本工具表现分 v${esc(D.scoreVersion)}，借鉴电竞数据分析中分职责评价的思路。权重由本工具定义，并非 Riot、WeGame、世界赛官方个人评分。</p><h3>参照来自哪里</h3><p>参照包含本次采集中所有玩家的有效对局，按游戏模式与英雄主定位分组。范围 ${esc(D.scoring.referenceRange.from)} 至 ${esc(D.scoring.referenceRange.to)}。每组至少 30 条玩家记录、5 场不同对局。切换日期和朋友不会重建参照；重新采集后参照可能更新。</p><h3>五个维度与权重</h3>${table(['英雄主定位',...A.axes.map(a=>A.axisNames[a])],Object.entries(A.weights).map(([c,w])=>'<tr><td>'+A.classes[c]+'</td>'+w.map(n=>'<td>'+n+'%</td>').join('')+'</tr>').join(''))}<ul><li>输出：对英雄伤害 ÷ 对局分钟数。</li><li>资源效率：个人英雄伤害占比 ÷ 个人金币占比；100% 表示两种份额相等。人头收入已包含在金币中，不再另扣。</li><li>参团：（击杀＋助攻）÷ 同队击杀数。</li><li>生存：死亡数 ÷ 对局分钟数，按反向百分位计分。</li><li>控制：timeCCingOthers ÷ 对局分钟数。</li></ul><p>百分位＝（比当前值低的条数＋相同值条数的一半）÷ 参考条数 × 100。每场先将五项百分位按该英雄定位加权，再逐场等权平均。常量维度为 50 分。KDA 展示但不另加入总分。</p><h3>缺失与小样本</h3><p>字段缺失、零分母、英雄定位未知、参照不足不硬凑总分。短于五分钟、提前结束、未支持模式保留明细但不评分。十场可评分记录以下只展示观察，不进入稳定排名。胜率分母只含已知胜负。</p><h3>个人建议</h3><p>对至少十场可评分样本，优先对平均百分位低于 30 的维度给出最多三条建议，并引用筛选内的具体对局。样本不足时仅提示积累和复盘方向。统计不能证明走位失误、抢人头或输局责任。</p><h3>当前参考样本</h3>${table(['模式','英雄定位','玩家记录','不同对局'],Object.entries(D.scoring.references).map(([key,r])=>{const [m,c]=key.split(':');return `<tr><td>${A.modes[m]}</td><td>${A.classes[c]}</td><td>${r.n}</td><td>${r.games}</td></tr>`;}).join(''))}<p>研究参考：<a href="https://arxiv.org/abs/2501.10049" target="_blank" rel="noreferrer">PandaSkill</a>。本工具没有复现论文模型。客户端接口覆盖与稳定性见 <a href="https://support-developer.riotgames.com/hc/en-us/articles/22698698001939-League-of-Legends" target="_blank" rel="noreferrer">Riot 说明</a>。</p></article>`;}
  function openMatch(id){
    const m=matchById.get(id);if(!m)return;
    $('match-content').innerHTML=`<h2>${esc(A.modes[m.mode])} · ${esc(m.day)}</h2><p class="muted small">对局 ${esc(m.gameId)} · ${esc(m.platform)} · ${num(m.duration/60)} 分钟 · 版本 ${esc(m.version)}</p>`+table(['玩家 / 英雄','K / D / A','表现分','伤害 / 分钟','相对伤转','参团','控制秒 / 分','承伤','装备 / 强化'],m.players.toSorted((a,b)=>Number(b.ally)-Number(a.ally)||a.participantId-b.participantId).map(p=>`<tr><td><span class="${p.ally?'cyan':''}">${esc(name(p.key))}${p.key===m.ownerKey?'（你）':''}</span><small class="score-label">${esc(p.champion)} · ${A.classes[p.classKey]} · ${p.ally?'同队':'对手'}</small></td><td>${num(p.stats.kills,0)} / ${num(p.stats.deaths,0)} / ${num(p.stats.assists,0)}</td><td>${num(p.score)}<small class="score-label">${esc(p.scoreReason||A.axes.map((a,i)=>A.axisNames[a]+':'+num(p.percentiles[a],0)+'×'+A.weights[p.classKey][i]+'%').join(' / '))}</small></td><td>${num(p.metrics.dpm,0)}<small class="score-label">总伤害 ${num(p.stats.totalDamageDealtToChampions,0)}</small></td><td>${pct(p.metrics.conversion)}</td><td>${pct(p.metrics.kp)}</td><td>${num(p.metrics.ccpm,2)}</td><td>${num(p.stats.totalDamageTaken,0)}</td><td class="gear">${esc(p.items.map(i=>D.static.items[i]||'装备 '+i).join(' · ')||'无记录')}<small class="score-label">${esc(p.augments.map(i=>D.static.augments[i]||'强化 '+i).join(' · '))}</small></td></tr>`).join(''))+'<p class="notice">评分拆解为本场百分位 × 定位权重；历史装备、强化名称使用采集时客户端映射。</p>';
    $('match-dialog').showModal();
  }
  function render(){
    for(const id of ['from','to','mode','outcome'])$(id).value=state[id];$('exclude-short').checked=state.excludeShort;
    try{filtered=A.select(D,state);$('filter-error').hidden=true;}catch(e){$('filter-error').hidden=false;$('filter-error').textContent=e.message;return;}
    renderFriends();for(const b of document.querySelectorAll('[data-view]')){b.classList.toggle('active',b.dataset.view===state.view);b.setAttribute('aria-current',b.dataset.view===state.view?'page':'false');}
    $('view').innerHTML=state.view==='method'?method():!state.friends.length?empty('先选朋友，再一起看战绩','在左侧勾选一起玩的朋友；本人始终保留在分析中。'):state.view==='profile'?profile():!filtered.length?empty('这段时间没有共同对局','尝试调整日期、模式、胜负，或者选择其他朋友。'):state.view==='matches'?matchesView():overview();persist();
  }
  $('owner-line').textContent=D.owner.name+'　/　'+D.matches.length+' 场已获取记录　/　北京时间';
  const cov=D.coverage;$('coverage').innerHTML=`覆盖 <b>${esc(D.scoring.referenceRange.from)} → ${esc(D.scoring.referenceRange.to)}</b>　·　已获取 <b>${D.matches.length}</b> 场　·　详情失败 <b>${cov.failures?.length||0}</b> 场　·　未支持模式 <b>${cov.unsupported}</b> 场　·　${esc(cov.source)}`;
  $('coverage-details').innerHTML=`<p>这是客户端、日志或导入文件实际能提供的记录，不保证账号完整历史。缺少记录时不会补成零表现。</p><p>索引结束原因：${esc(cov.historyTermination||'未知')}；缓存命中 ${cov.cached||0}；忽略其他账号对局 ${cov.unrelated||0}。</p>${cov.historyFailure?'<p>历史索引：'+esc(cov.historyFailure)+'</p>':''}${Object.entries(cov.validation||{}).map(([m,t])=>'<p>'+esc(A.modes[m])+'：'+esc(t)+'</p>').join('')}${cov.failures?.length?'<p>失败 ID / 文件：'+esc(cov.failures.map(x=>(x.id||x.file)+' '+(x.status||x.reason)).join('；'))+'</p>':''}<p>生成于 ${esc(D.generatedAt)}；数据结构 v${D.schemaVersion}；评分 v${esc(D.scoreVersion)}。</p>`;
  $('friend-search').addEventListener('input',renderFriends);
  $('friend-list').addEventListener('change',e=>{const k=e.target.dataset.friend;if(!k)return;state.friends=e.target.checked?[...new Set([...state.friends,k])]:state.friends.filter(x=>x!==k);if(state.focus!=='@self'&&!state.friends.includes(state.focus))state.focus='@self';state.page=0;render();});
  $('clear-friends').onclick=()=>{state.friends=[];state.focus='@self';render();};
  for(const id of ['from','to','mode','outcome'])$(id).addEventListener('change',()=>{state[id]=$(id).value;state.page=0;render();});
  $('exclude-short').onchange=()=>{state.excludeShort=$('exclude-short').checked;state.page=0;render();};$('reset-date').onclick=()=>{state.from=defaults.from;state.to=defaults.to;state.page=0;render();};
  document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){state.view=b.dataset.view;state.page=0;render();}if(b.dataset.profile){state.focus=b.dataset.profile;state.view='profile';render();}if(b.dataset.match)openMatch(b.dataset.match);if(b.dataset.page){state.page+=Number(b.dataset.page);render();}});
  $('view').addEventListener('change',e=>{if(e.target.id==='profile-select'){state.focus=e.target.value;render();}});$('close-dialog').onclick=()=>$('match-dialog').close();
  document.querySelector('.brand').onclick=e=>{e.preventDefault();state.view='overview';render();};
  $('export').onclick=()=>{
    const clone=document.documentElement.cloneNode(true);clone.querySelector('#saved-state').textContent=JSON.stringify(state).replace(/[<>&\u2028\u2029]/g,c=>'\\u'+c.charCodeAt(0).toString(16).padStart(4,'0'));clone.querySelector('#match-dialog').removeAttribute('open');clone.querySelector('#toast').hidden=true;
    const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='LOL-开黑战绩-'+state.from+'_'+state.to+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('已导出包含当前选择的完整离线报告。');
  };
  render();
})();
</script>
</body></html>
